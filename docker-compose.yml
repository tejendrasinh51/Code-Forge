 # Local development only. Provides Postgres + Redis.
# The app (turbo) is deployed separately — run `pnpm dev` on the host.
services:
  db:
    image: postgres:15-alpine
    container_name: code-forge-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d code-forge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev
      - POSTGRES_DB=code-forge
    networks:
      - code-forge-network

  redis:
    image: redis:7-alpine
    container_name: code-forge-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb
    networks:
      - code-forge-network

volumes:
  postgres_data:
  redis_data:

networks:
  code-forge-network:
    driver: bridge
